<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Injury Density — Interactive 3D Model</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0d10;
    font-family: 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
    color: #e8ece8;
  }
  #app { display: flex; width: 100%; height: 100vh; overflow: hidden; }
  #viewport { flex: 1 1 60%; position: relative; }
  #canvas-mount { width: 100%; height: 100%; cursor: grab; }
  #canvas-mount.dragging { cursor: grabbing; }
  #canvas-mount canvas { display: block; }
  .label-top {
    position: absolute; top: 14px; left: 18px; z-index: 2;
    font-family: ui-monospace, Menlo, monospace;
    letter-spacing: 1.5px; font-size: 11px;
    color: #7c8891; text-transform: uppercase;
  }
  /* Multiple Body Parts card (top-right of viewport) */
  #multi-card {
    position: absolute; top: 14px; right: 18px; z-index: 3;
    background: #161c20; border: 1px solid #2a333a;
    border-radius: 8px; padding: 10px 14px;
    min-width: 150px;
    font-family: 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  #multi-card .label {
    font-size: 10.5px; letter-spacing: 1.4px;
    color: #7c8891; text-transform: uppercase;
    margin-bottom: 4px;
  }
  #multi-card .value {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 26px; font-weight: 700;
    color: #e8ece8; line-height: 1;
  }
  #multi-card .sub {
    font-size: 10.5px; color: #7c8891; margin-top: 3px;
  }
  .controls {
    position: absolute; bottom: 14px; left: 18px;
    display: flex; gap: 8px; z-index: 2;
  }
  .btn {
    background: #161c20; color: #c8cdd0;
    border: 1px solid #2a333a; border-radius: 6px;
    padding: 6px 12px; font-size: 12px; cursor: pointer;
    font-family: ui-monospace, Menlo, monospace;
  }
  .btn.active { background: #c6ff3d; color: #0a0d10; }
  .hint {
    position: absolute; bottom: 14px; right: 18px;
    font-size: 10.5px; color: #57626a;
    font-family: ui-monospace, Menlo, monospace; z-index: 2;
  }
  #panel {
    flex: 1 1 40%;
    border-left: 1px solid #1c2226;
    background: #0d1114;
    padding: 18px 20px;
    display: flex; flex-direction: column;
    gap: 16px; min-width: 280px;
    box-sizing: border-box; overflow: hidden;
  }
  .section-label {
    font-size: 11px; letter-spacing: 1.5px;
    color: #7c8891; text-transform: uppercase;
    margin-bottom: 8px;
  }
  #selected-region { display: flex; align-items: baseline; gap: 10px; }
  #selected-region .empty { font-size: 14px; color: #5a656d; }
  #selected-region .name { font-size: 22px; font-weight: 700; }
  #selected-region .count {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 22px; font-weight: 700;
  }
  #selected-region .unit { font-size: 11px; color: #7c8891; }
  #legend-bar { display: flex; height: 10px; border-radius: 4px; overflow: hidden; }
  #legend-bar div { flex: 1; }
  #legend-ticks {
    display: flex; justify-content: space-between;
    margin-top: 6px; font-size: 10.5px; color: #5a656d;
    font-family: ui-monospace, Menlo, monospace;
  }
  #ranked-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .rank-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent;
  }
  .rank-row.selected { background: #161c20; border: 1px solid #2a333a; }
  .rank-row .idx { width: 18px; font-size: 11px; color: #57626a; font-family: ui-monospace, Menlo, monospace; }
  .rank-row .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .rank-row .name { flex: 1; font-size: 13px; }
  .rank-row .val { font-size: 13px; font-family: ui-monospace, Menlo, monospace; color: #c8cdd0; }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div class="label-top">Injury Density — Interactive Model</div>
    <div id="multi-card">
      <div class="label">Multiple Body Parts</div>
      <div class="value" id="multi-value">0</div>
      <div class="sub">injuries reported</div>
    </div>
    <div id="canvas-mount"></div>
    <div class="controls">
      <button class="btn active" id="btn-autorotate">⏸ Pause spin</button>
      <button class="btn" id="btn-reset">⟲ Reset view</button>
    </div>
    <div class="hint">drag to rotate · click a region for detail</div>
  </div>
  <div id="panel">
    <div>
      <div class="section-label">Selected region</div>
      <div id="selected-region"><span class="empty">Hover or click a body region on the model</span></div>
    </div>
    <div>
      <div class="section-label">Scale</div>
      <div id="legend-bar"></div>
      <div id="legend-ticks"><span>0</span><span id="legend-mid"></span><span id="legend-max"></span></div>
    </div>
    <div style="flex:1; min-height:0; display:flex; flex-direction:column;">
      <div class="section-label">Hot spots, ranked</div>
      <div id="ranked-list"></div>
    </div>
  </div>
</div>
<script>
  // -------------------------------------------------------------------
  // INJURY DATA — placeholders. Wire to Power BI later.
  // "multiple" is intentionally isolated (no `part`, its own card).
  // -------------------------------------------------------------------
  const INJURY_DATA = [
    { id: "abdomen",     label: "Abdomen",             count: 8,  part: "abdomen"  },
    { id: "ankle",       label: "Ankle",               count: 15, part: "ankle"    },
    { id: "arm_elbow",   label: "Arm/Elbow",           count: 22, part: "arm"      },
    { id: "back",        label: "Back",                count: 30, part: "back"     },
    { id: "eyes",        label: "Eyes",                count: 2,  part: "eyes"     },
    { id: "hand_finger", label: "Hand/Finger",         count: 18, part: "hand"     },
    { id: "leg_lower",   label: "Leg Lower",           count: 12, part: "legLower" },
    { id: "leg_upper",   label: "Leg Upper",           count: 14, part: "legUpper" },
    { id: "multiple",    label: "Multiple Body Parts", count: 5,  part: null       },
    { id: "neck",        label: "Neck",                count: 4,  part: "neck"     },
    { id: "shoulder",    label: "Shoulder",            count: 19, part: "shoulder" },
  ];

  // Everything with a `part` is a mappable region; "multiple" is its own card.
  const MAPPABLE = INJURY_DATA.filter(d => d.part);
  const maxCount = Math.max(...MAPPABLE.map(d => d.count));
  const dataByPart = Object.fromEntries(MAPPABLE.map(d => [d.part, d]));
  const dataById = Object.fromEntries(INJURY_DATA.map(d => [d.id, d]));
  const multipleData = INJURY_DATA.find(d => d.id === "multiple");

  // ---------------- color gradient: light grey -> dark red ----------------
  function heatColor(t) {
    t = Math.max(0, Math.min(1, t));
    const start = [211, 211, 211]; // #D3D3D3
    const end   = [139,   0,   0]; // #8B0000
    const r = Math.round(start[0] + (end[0] - start[0]) * t);
    const g = Math.round(start[1] + (end[1] - start[1]) * t);
    const b = Math.round(start[2] + (end[2] - start[2]) * t);
    return { css: `rgb(${r},${g},${b})`, hex: (r << 16) | (g << 8) | b };
  }

  const NEUTRAL_COLOR = 0x3a4048;

  // ---------------- humanoid built from primitives ----------------
  function buildFigure() {
    const group = new THREE.Group();
    const partToMeshes = {};

    function trackedMesh(part, geo, pos, rot) {
      const d = dataByPart[part];
      const t = d ? d.count / maxCount : 0;
      const color = d ? heatColor(t).hex : NEUTRAL_COLOR;
      const mat = new THREE.MeshStandardMaterial({
        color, roughness: 0.5, metalness: 0.05,
        emissive: 0x000000, emissiveIntensity: 0,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(...pos);
      if (rot) mesh.rotation.set(...rot);
      mesh.userData.part = part;
      mesh.userData.baseColor = color;
      group.add(mesh);
      if (!partToMeshes[part]) partToMeshes[part] = [];
      partToMeshes[part].push(mesh);
      return mesh;
    }

    function neutralMesh(geo, pos, rot, color) {
      const mat = new THREE.MeshStandardMaterial({
        color: color ?? NEUTRAL_COLOR, roughness: 0.6, metalness: 0.05,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(...pos);
      if (rot) mesh.rotation.set(...rot);
      group.add(mesh);
      return mesh;
    }

    // head + eyes
    const head = neutralMesh(new THREE.SphereGeometry(0.4, 28, 28), [0, 2.05, 0], null, 0x4a5058);
    head.scale.set(0.95, 1.1, 0.95);
    trackedMesh("eyes", new THREE.SphereGeometry(0.07, 14, 14), [-0.14, 2.12, 0.34]);
    trackedMesh("eyes", new THREE.SphereGeometry(0.07, 14, 14), [ 0.14, 2.12, 0.34]);

    // neck
    trackedMesh("neck", new THREE.CylinderGeometry(0.14, 0.16, 0.28, 20), [0, 1.60, 0]);

    // shoulders
    trackedMesh("shoulder", new THREE.SphereGeometry(0.22, 20, 20), [-0.56, 1.32, 0]);
    trackedMesh("shoulder", new THREE.SphereGeometry(0.22, 20, 20), [ 0.56, 1.32, 0]);

    // torso: abdomen (front) + back (rear)
    const torsoW = 0.9, torsoH = 1.35, halfDepth = 0.22;
    trackedMesh("abdomen", new THREE.BoxGeometry(torsoW, torsoH, halfDepth), [0, 0.72,  halfDepth / 2]);
    trackedMesh("back",    new THREE.BoxGeometry(torsoW, torsoH, halfDepth), [0, 0.72, -halfDepth / 2]);
    neutralMesh(new THREE.CylinderGeometry(0.42, 0.42, 0.18, 24), [0, 1.30, 0], null, 0x4a5058);

    // hips (not in region list)
    neutralMesh(new THREE.BoxGeometry(0.85, 0.32, 0.5), [0, -0.10, 0], null, 0x4a5058);

    // arms (arm/elbow region)
    trackedMesh("arm", new THREE.CylinderGeometry(0.13, 0.115, 0.72, 16), [-0.72, 0.85, 0]);
    trackedMesh("arm", new THREE.SphereGeometry(0.14, 16, 16),             [-0.72, 0.45, 0]);
    trackedMesh("arm", new THREE.CylinderGeometry(0.11, 0.09, 0.68, 16),  [-0.72, 0.06, 0]);
    trackedMesh("arm", new THREE.CylinderGeometry(0.13, 0.115, 0.72, 16), [ 0.72, 0.85, 0]);
    trackedMesh("arm", new THREE.SphereGeometry(0.14, 16, 16),             [ 0.72, 0.45, 0]);
    trackedMesh("arm", new THREE.CylinderGeometry(0.11, 0.09, 0.68, 16),  [ 0.72, 0.06, 0]);

    // hands
    const handL = trackedMesh("hand", new THREE.SphereGeometry(0.14, 18, 18), [-0.72, -0.34, 0]);
    handL.scale.set(0.8, 1.3, 0.55);
    const handR = trackedMesh("hand", new THREE.SphereGeometry(0.14, 18, 18), [ 0.72, -0.34, 0]);
    handR.scale.set(0.8, 1.3, 0.55);

    // legs upper (thigh + knee)
    trackedMesh("legUpper", new THREE.CylinderGeometry(0.2, 0.17, 0.9, 18), [-0.24, -0.80, 0]);
    trackedMesh("legUpper", new THREE.SphereGeometry(0.18, 18, 18),         [-0.24, -1.30, 0]);
    trackedMesh("legUpper", new THREE.CylinderGeometry(0.2, 0.17, 0.9, 18), [ 0.24, -0.80, 0]);
    trackedMesh("legUpper", new THREE.SphereGeometry(0.18, 18, 18),         [ 0.24, -1.30, 0]);

    // legs lower (shin)
    trackedMesh("legLower", new THREE.CylinderGeometry(0.15, 0.11, 0.9, 16), [-0.24, -1.80, 0]);
    trackedMesh("legLower", new THREE.CylinderGeometry(0.15, 0.11, 0.9, 16), [ 0.24, -1.80, 0]);

    // ankles + feet
    trackedMesh("ankle", new THREE.SphereGeometry(0.13, 16, 16), [-0.24, -2.28, 0]);
    trackedMesh("ankle", new THREE.SphereGeometry(0.13, 16, 16), [ 0.24, -2.28, 0]);
    trackedMesh("ankle", new THREE.BoxGeometry(0.22, 0.12, 0.42), [-0.24, -2.32, 0.12]);
    trackedMesh("ankle", new THREE.BoxGeometry(0.22, 0.12, 0.42), [ 0.24, -2.32, 0.12]);

    return { group, partToMeshes };
  }

  // ---------------- side panel rendering ----------------
  function renderLegend() {
    const bar = document.getElementById("legend-bar");
    bar.innerHTML = "";
    for (let i = 0; i < 40; i++) {
      const seg = document.createElement("div");
      seg.style.background = heatColor(i / 39).css;
      bar.appendChild(seg);
    }
    document.getElementById("legend-mid").textContent = Math.round(maxCount / 2);
    document.getElementById("legend-max").textContent = maxCount;
  }

  function renderRankedList(selectedId, onPick) {
    const list = document.getElementById("ranked-list");
    list.innerHTML = "";
    // Exclude "multiple" from the ranked list — it lives on the card
    const sorted = MAPPABLE.slice().sort((a, b) => b.count - a.count);
    sorted.forEach((d, i) => {
      const row = document.createElement("div");
      row.className = "rank-row" + (d.id === selectedId ? " selected" : "");
      row.innerHTML = `
        <span class="idx">${i + 1}</span>
        <span class="swatch" style="background:${heatColor(d.count / maxCount).css}"></span>
        <span class="name">${d.label}</span>
        <span class="val">${d.count}</span>
      `;
      row.addEventListener("click", () => onPick(d.id));
      list.appendChild(row);
    });
  }

  function renderSelected(id) {
    const el = document.getElementById("selected-region");
    const d = id ? dataById[id] : null;
    if (!d || !d.part) {
      el.innerHTML = `<span class="empty">Hover or click a body region on the model</span>`;
      return;
    }
    const color = heatColor(d.count / maxCount).css;
    el.innerHTML = `
      <span class="name">${d.label}</span>
      <span class="count" style="color:${color}">${d.count}</span>
      <span class="unit">injuries</span>
    `;
  }

  function renderMultipleCard() {
    document.getElementById("multi-value").textContent =
      multipleData ? multipleData.count : 0;
  }

  // ---------------- three.js setup ----------------
  const mount = document.getElementById("canvas-mount");
  const width = mount.clientWidth;
  const height = mount.clientHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
  camera.position.set(0, 0, 8);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  mount.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const key = new THREE.DirectionalLight(0xffffff, 1.0);
  key.position.set(3, 5, 4); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.35);
  fill.position.set(-3, 2, -4); scene.add(fill);

  const { group, partToMeshes } = buildFigure();
  scene.add(group);

  const interactive = [];
  Object.values(partToMeshes).forEach(arr => arr.forEach(m => interactive.push(m)));

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  const state = {
    autoRotate: true, dragging: false,
    lastX: 0, lastY: 0, downX: 0, downY: 0,
    rotY: 0.4, rotX: 0,
    hoveredPart: null, selectedPart: null, selectedId: null,
  };

  function setPartHighlight(part, active) {
    if (!part || !partToMeshes[part]) return;
    partToMeshes[part].forEach(mesh => {
      mesh.material.emissive.setHex(active ? mesh.userData.baseColor : 0x000000);
      mesh.material.emissiveIntensity = active ? 0.55 : 0;
    });
  }

  function updatePointer(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  }

  function pickPart() {
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(interactive, false);
    return hits.length ? hits[0].object.userData.part : null;
  }

  function selectById(id) {
    const d = dataById[id];
    if (!d || !d.part) return;
    if (state.selectedPart && state.selectedPart !== d.part) {
      setPartHighlight(state.selectedPart, state.selectedPart === state.hoveredPart);
    }
    state.selectedId = id;
    state.selectedPart = d.part;
    setPartHighlight(d.part, true);
    renderSelected(id);
    renderRankedList(id, selectById);
  }

  mount.addEventListener("pointerdown", (e) => {
    state.dragging = true;
    mount.classList.add("dragging");
    state.autoRotate = false;
    const btn = document.getElementById("btn-autorotate");
    btn.classList.remove("active");
    btn.textContent = "▶ Auto-rotate";
    state.lastX = e.clientX; state.lastY = e.clientY;
    state.downX = e.clientX; state.downY = e.clientY;
  });

  window.addEventListener("pointermove", (e) => {
    if (state.dragging) {
      const dx = e.clientX - state.lastX;
      const dy = e.clientY - state.lastY;
      state.lastX = e.clientX; state.lastY = e.clientY;
      state.rotY += dx * 0.01;
      state.rotX = Math.max(-0.6, Math.min(0.6, state.rotX + dy * 0.01));
    } else {
      updatePointer(e.clientX, e.clientY);
      const part = pickPart();
      if (part !== state.hoveredPart) {
        if (state.hoveredPart && state.hoveredPart !== state.selectedPart) {
          setPartHighlight(state.hoveredPart, false);
        }
        state.hoveredPart = part;
        if (part) setPartHighlight(part, true);
        if (part && dataByPart[part]) renderSelected(dataByPart[part].id);
        else if (state.selectedId) renderSelected(state.selectedId);
        else renderSelected(null);
      }
    }
  });

  window.addEventListener("pointerup", (e) => {
    const moved = Math.abs(e.clientX - state.downX) + Math.abs(e.clientY - state.downY);
    state.dragging = false;
    mount.classList.remove("dragging");
    if (moved < 3) {
      updatePointer(e.clientX, e.clientY);
      const part = pickPart();
      if (part && dataByPart[part]) selectById(dataByPart[part].id);
    }
  });

  document.getElementById("btn-autorotate").addEventListener("click", () => {
    state.autoRotate = !state.autoRotate;
    const btn = document.getElementById("btn-autorotate");
    btn.classList.toggle("active", state.autoRotate);
    btn.textContent = state.autoRotate ? "⏸ Pause spin" : "▶ Auto-rotate";
  });

  document.getElementById("btn-reset").addEventListener("click", () => {
    state.rotY = 0.4; state.rotX = 0;
  });

  function animate() {
    if (state.autoRotate) state.rotY += 0.006;
    group.rotation.set(state.rotX, state.rotY, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();

  window.addEventListener("resize", () => {
    const w = mount.clientWidth, h = mount.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  renderLegend();
  renderRankedList(null, selectById);
  renderSelected(null);
  renderMultipleCard();
</script>
</body>
</html>
